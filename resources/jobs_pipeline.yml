# The data pipeline, in dependency order.
#
# Every stage is a JOB task. bronze/silver/glossary are spark_python_task (SQL via the
# statement-execution API); GOLD_ENRICHMENT and SERVING are serverless notebook_task
# notebooks (SQL via their own Spark session). ServiceNow exports also flow through a
# Lakeflow Spark Declarative Pipeline (land_servicenow -> servicenow_lakeflow; see
# resources/pipeline_servicenow.yml). rd_tasks_serving itself stays a plain Delta table
# (CDF on) built by the serving notebook: the KA streams from it, and you cannot stream
# from a materialized view.
#
#   parse_tickets / load_tables  — stdlib markdown parse -> rnd_tickets (bronze),
#                                  including the appended synthetic tickets.
#   build_silver                 — ingest/build_silver.py shapes bronze
#                                  into rd_tasks_silver (+ rd_task_note_entries):
#                                  content_hash gate + location parse, CDF on. The
#                                  silver layer is produced HERE, with the data, and
#                                  read by the pipeline as an external source.
#   glossary                     — mines the controlled vocabulary from bronze
#                                  rnd_tickets, so it can be built and SME-approved
#                                  BEFORE the pipeline's gold_enrichment reads the
#                                  approved terms.
#   enrich                       — notebook: rd_tasks_gold_enrichment via ai_query,
#                                  incremental by a content_hash LEFT ANTI JOIN + MERGE,
#                                  so a re-run with no new tickets does zero LLM work.
#   serving                      — notebook: builds rd_tasks_serving as a PLAIN DELTA
#                                  table (CDF on) — silver ⋈ rnd_tickets ⋈ enrichment ⋈
#                                  note counts, ka_content composed — then the curated
#                                  Genie analytics views, then verify() (incl. a
#                                  table-type check the KA streaming attach requires).
#
# RETARGETING: the spark_python_task steps pass --catalog/--schema/--warehouse-id
# (preflight/env.py turns them into the module globals table names derive from). The
# notebook steps take catalog/schema via notebook_task base_parameters (dbutils.widgets)
# and need no warehouse — they run SQL on their own serverless notebook compute.

resources:
  jobs:
    rkb_data_pipeline:
      name: "[${bundle.target}] Field Repair data pipeline (bronze -> serving)"
      description: >-
        parse -> load -> {silver, glossary} -> enrich (notebook) -> serving (notebook).
        Idempotent end to end; the content_hash anti-join + MERGE means a re-run with
        no new tickets does zero LLM work.

      # Serverless compute for the script tasks; no cluster to size or keep warm.
      environments:
        - environment_key: serverless
          spec:
            client: "3"
            dependencies:
              - requests
              - databricks-sdk

      # Fail loudly rather than leaving a half-built serving table.
      max_concurrent_runs: 1

      tasks:
        # --- bronze: markdown samples -> Delta ---
        - task_key: parse_tickets
          description: Parse the sample/synthetic markdown tickets into rows.
          environment_key: serverless
          spark_python_task:
            python_file: ../ingest/parse_tickets.py

        - task_key: load_tables
          description: Load parsed rows into rnd_tickets + ticket_activity.
          depends_on:
            - task_key: parse_tickets
          environment_key: serverless
          spark_python_task:
            python_file: ../ingest/load_tables.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --warehouse-id
              - ${var.warehouse_id}

        # --- silver: shape bronze into rd_tasks_silver (+ note entries) ---
        - task_key: build_silver
          description: >-
            Build rd_tasks_silver (+ rd_task_note_entries) from bronze rnd_tickets
            (real + synthetic): content_hash gate + location parse, CDF on.
          depends_on:
            - task_key: load_tables
          environment_key: serverless
          spark_python_task:
            python_file: ../ingest/build_silver.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --warehouse-id
              - ${var.warehouse_id}

        # --- glossary: the controlled vocabulary, mined from BRONZE rnd_tickets so
        #     it is available (and approvable) before the enrich pipeline runs ---
        - task_key: glossary
          description: Build the glossary; approvals drive the enrichment enums.
          depends_on:
            - task_key: load_tables
          environment_key: serverless
          spark_python_task:
            python_file: ../enrich/build_glossary.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --warehouse-id
              - ${var.warehouse_id}

        # --- gold enrichment (notebook, serverless): incremental ai_query + MERGE ---
        # Serverless notebook task = NO environment_key / cluster and NO warehouse; it runs
        # SQL on its own Spark session. enum vocab comes from the APPROVED glossary at run
        # time. ai_query only touches new/changed tickets (content_hash anti-join).
        - task_key: enrich
          description: >-
            Build rd_tasks_gold_enrichment via ai_query, incremental by a content_hash
            LEFT ANTI JOIN + MERGE. Reads rd_tasks_silver + glossary.
          depends_on:
            - task_key: build_silver
            - task_key: glossary
          notebook_task:
            notebook_path: ../enrich/enrich.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        # --- serving table (notebook, serverless): plain Delta + CDF, analytics, verify ---
        - task_key: serving
          description: >-
            Build rd_tasks_serving as a PLAIN Delta table (CDF on) so the KA can stream from
            it; then the curated Genie analytics views; then verify() (incl. table-type check).
          depends_on:
            - task_key: enrich
          notebook_task:
            notebook_path: ../enrich/serving.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        # --- Lakeflow: ServiceNow exports land in a Volume, then the declarative
        #     pipeline ingests them (Auto Loader bronze -> AUTO CDC silver -> site MV).
        #     Runs alongside the bronze load; nothing downstream depends on it yet.
        - task_key: land_servicenow
          description: Write ServiceNow rd_task JSON exports into the servicenow_landing Volume.
          environment_key: serverless
          spark_python_task:
            python_file: ../ingest/land_servicenow_exports.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}

        - task_key: servicenow_lakeflow
          description: >-
            Run the servicenow_ingest Lakeflow pipeline: Volume -> servicenow_rd_task_bronze
            -> servicenow_rd_task_silver -> servicenow_site_summary.
          depends_on:
            - task_key: land_servicenow
          pipeline_task:
            pipeline_id: ${resources.pipelines.servicenow_ingest.id}

        # --- Lakebase: push new/changed tickets from Lakeflow silver (+ enrichment) into
        #     the Lakebase fis_tasks table the v2 agent and app search. Incremental by
        #     content_hash, so a no-change run embeds and writes nothing.
        - task_key: lakebase_sync
          description: >-
            Embed new/changed tickets from servicenow_rd_task_silver (+ location and
            enrichment) and upsert them into Lakebase fis_tasks (pgvector + full-text).
          depends_on:
            - task_key: servicenow_lakeflow
            - task_key: enrich
          notebook_task:
            notebook_path: ../lakebase/lakebase_sync.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              lakebase_project: ${var.lakebase_project}
              lakebase_branch: ${var.lakebase_branch}
              lakebase_endpoint: ${var.lakebase_endpoint}
              lakebase_database: ${var.lakebase_database}
              lakebase_table: ${var.lakebase_table}

      tags:
        project: rkb-knowledge-agent
        layer: data-pipeline
